[project]
name = "opagent-worker"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = ["opagent-core", "opagent-fs-sandbox", "opagent-inference-sdk", "opagent-schemas", "httpx", "pillow", "blake3", "pillow-heif", "numpy", "tzfpy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opagent_worker"]
