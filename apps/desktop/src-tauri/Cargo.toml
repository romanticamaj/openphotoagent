[package]
name = "openphotoagent"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "OpenPhotoAgent desktop shell (Tauri 2)"
publish = false

# its own workspace: built by the desktop CI matrix (needs WebView headers); `just test` only builds ../supervisor
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
opagent-supervisor = { path = "../supervisor" }
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
dirs = "6"
ureq = "3"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
