[package]
name = "opagent-supervisor"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "OpenPhotoAgent desktop shell logic: child supervision, restart policy, data-dir lock, updater policy (08 §1)"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "opagent-orphan-probe"
path = "src/bin/orphan_probe.rs"
test = false

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev]
debug = 0

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }
