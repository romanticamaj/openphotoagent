[project]
name = "opagent-cli"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = ["opagent-api", "opagent-worker", "opagent-db", "opagent-mcp-tools", "opagent-secure-file", "uvicorn", "httpx", "keyring>=25"]

[project.scripts]
opagent = "opagent_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opagent_cli"]
