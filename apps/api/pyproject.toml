[project]
name = "opagent-api"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "opagent-core",
    "opagent-schemas",
    "opagent-db",
    "opagent-registry",
    "opagent-doctor",
    "opagent-search",
    "fastapi",
    "uvicorn",
    "argon2-cffi>=25.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opagent_api"]
