[project]
name = "opagent-api"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = ["opagent-core", "opagent-schemas", "opagent-db", "opagent-registry", "opagent-doctor", "fastapi", "uvicorn"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opagent_api"]
