[project]
name = "opagent-api"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "opagent-core",
    "pyjwt>=2.8",
    "cryptography",
    "opagent-schemas",
    "opagent-db",
    "opagent-registry",
    "opagent-doctor",
    "opagent-search",
    "opagent-mcp-tools",
    "opagent-assistant",
    "fastapi",
    "jsonschema>=4.23",
    "keyring>=25",
    "pillow",
    "uvicorn",
    "argon2-cffi>=25.1.0",
    "python-multipart>=0.0.33",
    "scikit-learn>=1.9.1",
    "numpy>=2.5.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opagent_api"]
