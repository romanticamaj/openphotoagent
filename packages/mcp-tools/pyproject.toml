[project]
name = "opagent-mcp-tools"
version = "0.0.1"
requires-python = ">=3.12"
description = "MCP tool registry, scopes, sanitising, handles and the local credential store (05 §3)"
dependencies = ["opagent-core", "opagent-secure-file", "jsonschema>=4.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opagent_mcp"]
