[project]
name = "opagent-search"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = ["opagent-core", "opagent-geo", "jieba>=0.42", "opencc-python-reimplemented>=0.1.7", "pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opagent_search"]
