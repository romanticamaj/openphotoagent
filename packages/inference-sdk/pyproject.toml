[project]
name = "opagent-inference-sdk"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "numpy", "json-repair>=0.30", "opagent-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opagent_inference"]
