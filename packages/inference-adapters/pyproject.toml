[project]
name = "opagent-inference-adapters"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = ["opagent-core", "opagent-inference-sdk", "httpx", "numpy", "pillow", "tokenizers>=0.20", "onnxruntime>=1.18; sys_platform != 'win32'", "onnxruntime-directml>=1.18; sys_platform == 'win32'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opagent_adapters"]
