[project]
name = "opagent-inference-adapters"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = ["opagent-core", "opagent-inference-sdk", "httpx", "numpy", "pillow", "onnxruntime>=1.18"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opagent_adapters"]
