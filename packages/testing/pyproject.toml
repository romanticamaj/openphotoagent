[project]
name = "opagent-testing"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = ["opagent-core", "pytest", "psycopg[binary]>=3.2"]

[project.entry-points.pytest11]
opagent_testing = "opagent_testing.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opagent_testing"]
