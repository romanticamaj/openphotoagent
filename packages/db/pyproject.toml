[project]
name = "opagent-db"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "opagent-core",
    "opagent-schemas",
    "sqlalchemy>=2",
    "psycopg[binary]>=3.2",
    "alembic>=1.20.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opagent_db"]
