[project]
name = "pytest-opagent-tc"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = ["pytest"]

[project.entry-points.pytest11]
opagent_tc = "pytest_opagent_tc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_opagent_tc"]
