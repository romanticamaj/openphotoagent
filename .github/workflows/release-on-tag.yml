# Publishes a GitHub Release when a maintainer pushes a vX.Y.Z tag by hand
# (release-please tags are created with GITHUB_TOKEN and do not trigger this workflow).
# Notes are taken from the matching section of CHANGELOG.md. Idempotent: skips if the release exists.
name: release-on-tag

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches version.txt
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE="$(tr -d '[:space:]' < version.txt)"
          if [ "$TAG" != "$FILE" ]; then
            echo "::error::Tag v$TAG does not match version.txt ($FILE)"; exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?" v "\\]?([ (]|$)" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No CHANGELOG.md section for $VERSION"; exit 1
          fi
          cat notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."; exit 0
          fi
          FLAGS=""
          # Pre-releases: any -alpha/-beta/-rc tag, and the v0.0.x design-phase line.
          case "$TAG" in
            *-*|v0.0.*) FLAGS="--prerelease" ;;
          esac
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag $FLAGS
