# Opens/updates a "Release PR" from Conventional Commits on main.
# Merging that PR bumps version.txt, updates CHANGELOG.md, tags vX.Y.Z and publishes the GitHub Release.
name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # GITHUB_TOKEN tags do not trigger workflows (08 C-27): build and attach the desktop installers from here
  desktop:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/desktop-build.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
