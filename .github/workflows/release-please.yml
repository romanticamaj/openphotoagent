# Opens/updates a "Release PR" from Conventional Commits on main.
# Merging that PR bumps version.txt, updates CHANGELOG.md, tags vX.Y.Z and publishes the GitHub Release.
name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
