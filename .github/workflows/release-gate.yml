# Release gate (09 §5.4, 11 §5): every v0.1 test id (layer ≠ M) has a passing result, plus layer-G cases.
name: release-gate
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ["release-please-config.json", ".release-please-manifest.json", "version.txt"]
permissions:
  contents: read
env:
  UV_SYSTEM_CERTS: "1"
jobs:
  gate-cases:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: OPAGENT_TC_RESULTS=.tc/py-gate.json uv run pytest -q -m release_gate -o addopts="-p no:cacheprovider --import-mode=importlib"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: tc-gate, path: .tc/ }
  supply-chain:  # SEC-SBOM-001: SBOM + vulnerability gate (High/Critical without a VEX reason block the release)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: cargo install cargo-audit --locked
      - run: cd apps/desktop/src-tauri && cargo generate-lockfile
      - run: uv run python tools/sbom.py > sbom.cdx.json
      - run: uv run python tools/vuln_scan.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: sbom, path: sbom.cdx.json }
  gate:
    needs: [gate-cases, supply-chain]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Collect results from the latest ci / desktop / nightly runs on this ref
        uses: dawidd6/action-download-artifact@v6
        with: { workflow_search: true, name: "tc-.*", name_is_regexp: true, path: dl, if_no_artifact_found: warn }
      - uses: actions/download-artifact@v4
        with: { name: tc-gate, path: dl/tc-gate }
      - run: mkdir -p .tc && find dl -name '*.json' -exec cp {} .tc/ \; && python3 tools/tc_status.py --gate=v0.1
