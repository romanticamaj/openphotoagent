# Categories for GitHub's "Generate release notes" button (PR labels).
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: ⚠️ Breaking Changes
      labels: [breaking]
    - title: ✨ Features
      labels: [enhancement, feature]
    - title: 🐛 Bug Fixes
      labels: [bug]
    - title: 🔒 Security
      labels: [security]
    - title: 🧪 Benchmarks
      labels: [benchmark]
    - title: 📚 Documentation
      labels: [documentation]
    - title: Other Changes
      labels: ["*"]
